name: Build Max Externals

on:
  push:
    branches: [master, console_externals]
  pull_request:
    branches: [master]
  workflow_dispatch:  # allows manual trigger from GitHub UI

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Clone Max SDK
        run: |
          git clone --depth 1 https://github.com/Cycling74/max-sdk.git "$RUNNER_TEMP/max-sdk"

      - name: Install Ninja
        run: brew install ninja

      - name: Generate wrapper code
        run: python3 max_external/scripts/generate_console7_family.py

      - name: Build macOS externals (universal)
        run: |
          cmake -S max_external -B build-max -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DMAX_SDK_BASE_DIR="$RUNNER_TEMP/max-sdk/source/max-sdk-base"
          cmake --build build-max -j

      - name: List built externals
        run: find max_external/externals -maxdepth 1 -name '*.mxo' | sort

      - name: Upload macOS externals
        uses: actions/upload-artifact@v4
        with:
          name: max-externals-macos
          path: max_external/externals/*.mxo

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Clone Max SDK
        shell: bash
        run: |
          git clone --depth 1 https://github.com/Cycling74/max-sdk.git "$RUNNER_TEMP/max-sdk"

      - name: Generate wrapper code
        run: python3 max_external/scripts/generate_console7_family.py

      - name: Build Windows externals
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cmake -S max_external -B build-max-win -G Ninja -DCMAKE_BUILD_TYPE=Release -DMAX_SDK_BASE_DIR="%RUNNER_TEMP%\max-sdk\source\max-sdk-base"
          cmake --build build-max-win -j

      - name: Upload Windows externals
        uses: actions/upload-artifact@v4
        with:
          name: max-externals-windows
          path: max_external/externals/*.mxe64
